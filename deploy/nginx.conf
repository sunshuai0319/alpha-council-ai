# 前端与后端走同一个源，因此不需要任何 CORS 配置。
# 后端路由本身带 /api 前缀，所以 proxy_pass 不带路径即原样转发，
# 前端用相对路径 NEXT_PUBLIC_API_BASE_URL=/api 调用。

upstream alpha_web { server web:3000; }
upstream alpha_api { server api:8000; }

# WebSocket 升级只在真正需要时发送 Connection: upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    proxy_http_version 1.1;
    # 必须用 $http_host（原样 Host，含端口），不能用 $host —— $host 会把端口丢掉。
    # Next/Clerk 据此构造 handshake 重定向，丢了端口就会变成 http://<ip>/（80），
    # 而网关跑在 8888，浏览器于是 404。X-Forwarded-Host 同理，有些框架优先读它。
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # 后端较慢的周期接口留足时间（委员会要调 LLM）
    proxy_read_timeout 180s;

    location /api/ {
        proxy_pass http://alpha_api;
    }

    location / {
        proxy_pass http://alpha_web;
    }
}
