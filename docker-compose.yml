# 统一部署：nginx 网关 + 前端 + 后端 + worker。
#
# 只管应用。Postgres 与 Milvus/Zilliz 是外部已有服务，通过 backend/.env 里的
# DATABASE_URL / MILVUS_URI（或 ZILLIZ_URI）连接，不在这里起。
#
# 两个 env 文件，各管一段：
#   ./.env          网关端口、前端（NEXT_PUBLIC_*，构建与运行都要）
#   ./backend/.env  后端与 worker
#
# 常用命令：
#   docker-compose up -d --build
#   docker-compose logs -f worker
#   docker-compose build web        # 改了 NEXT_PUBLIC_* 之后必须重建前端
#   docker-compose up -d worker   # 只起 worker（不启动 web/api/gateway）

name: alpha-council-ai

# 前端公开变量：构建时要（内联进 bundle），运行期也要（中间件读 SIGN_IN_URL）
x-clerk-public: &clerk-public
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/dashboard}
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/dashboard}

# 本地 BGE 模型（12.8G）不再挂载：EMBEDDING_PROVIDER=doubao，BGEEmbedder/BGEReranker
# 都不会被实例化，挂载纯属浪费，而且 ${MODEL_DIR:?...} 这个必需变量会让所有 compose
# 命令在解析阶段就报错退出。
# 若要把嵌入切回 local（EMBEDDING_PROVIDER=local），需要自己给 api 和 worker 加回：
#   volumes: ["<宿主机模型目录>:/models:ro"]
#   environment: {EMBEDDING_MODEL_PATH: /models/bge-m3}

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # 迁移是幂等的，起服务前先补齐表结构
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  worker:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # 刻意不写 depends_on: api。worker 不调用 api —— 那个依赖只是借用
    # 「api 健康 = 迁移跑完了」来排序，代价是 `up --no-deps worker` 会被
    # 这个带条件的依赖卡住（报 "no such service: api"），想只起 worker 就起不来。
    # 迁移是幂等的：需要时先跑一次 docker compose up -d api，或手动 alembic upgrade head。
    command: python -m workers.scheduler
    # worker 只连数据库与交易所，不对外暴露端口

  web:
    build:
      context: ./frontend
      # NEXT_PUBLIC_CLERK_* 必须在构建时提供：实测缺了它，.next/server/middleware.js
      # 里会直接抛 "Missing publishableKey"，运行期再设环境变量无效。
      # 改了要重新构建：docker compose build web
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        <<: *clerk-public
    restart: unless-stopped
    # 运行期环境：
    #  - frontend/.env 提供 CLERK_SECRET_KEY（中间件校验会话用）
    #  - 下面的公开变量取自根 .env，与 build args 同源，避免两处漂移
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      <<: *clerk-public
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8888}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
