[project]
name = "alpha-council-ai-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pymilvus>=2.6,<3",
  # 本地 BGE 嵌入与 reranker 已移除：sentence-transformers 会把 torch 和 15 个
  # nvidia 包（实测约 2.87GB）拖进镜像，远程服务器 docker build 慢主要就是这个。
  # 嵌入走 Doubao（app/rag/embeddings.py），别再加回来。
  "langgraph>=0.6,<1",
  "httpx>=0.28,<1",
  "feedparser>=6.0,<7",
  "cryptography>=44,<47",
  "PyJWT[crypto]>=2.10,<3",
  "svix>=1.40,<2",
  "eth-account>=0.13,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008", "DTZ001"]

[[tool.mypy.overrides]]
module = ["pymilvus", "pymilvus.*"]
ignore_missing_imports = true
