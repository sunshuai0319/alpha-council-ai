services:
  api:
    build: .
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    # 交易撑在 worker 上：它挂了必须自动拉起，否则会静默停止交易。
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  worker:
    build: .
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    restart: unless-stopped
    command: python -m workers.scheduler
